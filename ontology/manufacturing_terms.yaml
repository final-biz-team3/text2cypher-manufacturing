ontologyVersion: manufacturing-v1

outputRoles:
  - roleId: product.component-id
    alias: componentId
    canonical: 하위 부품 식별자
    terms: [부품 ID, component ID]
    valueType: identity
    mappings:
      sql:
        - production.product.productid
        - production.productinventory.productid
        - purchasing.productvendor.productid
        - production.billofmaterials.componentid
      graph: [Product.productId]
  - roleId: product.component-name
    alias: componentName
    canonical: 하위 부품 이름
    terms: [부품명, component name]
    valueType: name
    mappings:
      sql: [production.product.name]
      graph: [Product.name]
  - roleId: product.finished-id
    alias: finishedProductId
    canonical: 완제품 식별자
    terms: [완제품 ID, finished product ID]
    valueType: identity
    mappings:
      graph: [Product.productId]
  - roleId: product.finished-name
    alias: finishedProductName
    canonical: 완제품 이름
    terms: [완제품명, finished product name]
    valueType: name
    mappings:
      graph: [Product.name]
  - roleId: product.root-id
    alias: rootProductId
    canonical: BOM 계층 루트 제품 식별자
    terms: [루트 제품 ID, root product ID]
    valueType: identity
    mappings:
      graph: [Product.productId]
  - roleId: product.root-name
    alias: rootProductName
    canonical: BOM 계층 루트 제품 이름
    terms: [루트 제품명, root product name]
    valueType: name
    mappings:
      graph: [Product.name]
  - roleId: product.finished-a-id
    alias: finishedProductIdA
    canonical: 첫 번째 완제품 식별자
    terms: [첫 번째 완제품 ID]
    valueType: identity
    mappings:
      graph: [Product.productId]
  - roleId: product.finished-b-id
    alias: finishedProductIdB
    canonical: 두 번째 완제품 식별자
    terms: [두 번째 완제품 ID]
    valueType: identity
    mappings:
      graph: [Product.productId]
  - roleId: supplier.a-id
    alias: supplierIdA
    canonical: 공급업체 쌍의 첫 번째 식별자
    terms: [첫 번째 공급업체 ID]
    valueType: identity
    mappings:
      sql: [purchasing.vendor.businessentityid]
      graph: [Supplier.supplierId]
  - roleId: supplier.a-name
    alias: supplierNameA
    canonical: 공급업체 쌍의 첫 번째 이름
    terms: [첫 번째 공급업체명]
    valueType: name
    mappings:
      sql: [purchasing.vendor.name]
      graph: [Supplier.name]
  - roleId: supplier.b-id
    alias: supplierIdB
    canonical: 공급업체 쌍의 두 번째 식별자
    terms: [두 번째 공급업체 ID]
    valueType: identity
    mappings:
      sql: [purchasing.vendor.businessentityid]
      graph: [Supplier.supplierId]
  - roleId: supplier.b-name
    alias: supplierNameB
    canonical: 공급업체 쌍의 두 번째 이름
    terms: [두 번째 공급업체명]
    valueType: name
    mappings:
      sql: [purchasing.vendor.name]
      graph: [Supplier.name]

entityRoles:
  - roleId: product
    canonical: 일반 제품 결과 엔티티
    terms: [제품, product]
    identityProjection:
      sql: {keys: [productId], labels: [productName]}
      graph: {keys: [productId], labels: [productName]}
  - roleId: component
    canonical: BOM 또는 공급 관계의 부품 결과 엔티티
    terms: [부품, component]
    identityProjection:
      sql: {keys: [componentId], labels: [componentName]}
      graph: {keys: [componentId], labels: [componentName]}
  - roleId: finishedProduct
    canonical: BOM 사용처·영향·생산 또는 지정된 두 끝점 경로에서 완제품 쪽을 나타내는 제품 결과 엔티티
    terms: [완제품, finished product]
    identityProjection:
      graph: {keys: [finishedProductId], labels: [finishedProductName]}
  - roleId: rootProduct
    canonical: BOM 계층이나 부품 트리 자체를 펼치는 결과에서만 그 계층의 기준이 되는 제품 결과 엔티티
    terms: [루트 제품, root product]
    identityProjection:
      graph: {keys: [rootProductId], labels: [rootProductName]}
  - roleId: finishedProductA
    canonical: 비교 또는 교집합의 첫 번째 완제품 기준점
    terms: [첫 번째 완제품]
    identityProjection:
      graph: {keys: [finishedProductIdA], labels: []}
  - roleId: finishedProductB
    canonical: 비교 또는 교집합의 두 번째 완제품 기준점
    terms: [두 번째 완제품]
    identityProjection:
      graph: {keys: [finishedProductIdB], labels: []}
  - roleId: supplier
    canonical: 공급업체 결과 엔티티
    terms: [공급업체, supplier]
    identityProjection:
      sql: {keys: [supplierId], labels: [supplierName]}
      graph: {keys: [supplierId], labels: [supplierName]}
  - roleId: supplierA
    canonical: 공급업체 쌍의 첫 번째 결과 엔티티
    terms: [첫 번째 공급업체]
    identityProjection:
      sql: {keys: [supplierIdA], labels: [supplierNameA]}
      graph: {keys: [supplierIdA], labels: [supplierNameA]}
  - roleId: supplierB
    canonical: 공급업체 쌍의 두 번째 결과 엔티티
    terms: [두 번째 공급업체]
    identityProjection:
      sql: {keys: [supplierIdB], labels: [supplierNameB]}
      graph: {keys: [supplierIdB], labels: [supplierNameB]}
  - roleId: category
    canonical: 제품 분류 결과 엔티티
    terms: [제품 분류, category]
    identityProjection:
      sql: {keys: [categoryId], labels: [categoryName]}
  - roleId: subcategory
    canonical: 제품 하위 분류 결과 엔티티
    terms: [제품 하위 분류, subcategory]
    identityProjection:
      sql: {keys: [subcategoryId], labels: [subcategoryName]}
  - roleId: location
    canonical: 재고 위치 또는 작업장 결과 엔티티
    terms: [재고 위치, 작업장, location]
    identityProjection:
      sql: {keys: [locationId], labels: [locationName]}
      graph: {keys: [locationId], labels: [locationName]}
  - roleId: scrapReason
    canonical: 폐기 사유 결과 엔티티
    terms: [폐기 사유, scrap reason]
    identityProjection:
      sql: {keys: [scrapReasonId], labels: [scrapReasonName]}
      graph: {keys: [scrapReasonId], labels: [scrapReasonName]}
  - roleId: workOrder
    canonical: 작업지시 결과 엔티티
    terms: [작업지시, work order]
    identityProjection:
      sql: {keys: [workOrderId], labels: []}
      graph: {keys: [workOrderId], labels: []}
  - roleId: routingOperation
    canonical: 작업 공정 결과 엔티티
    terms: [작업 공정, routing operation]
    identityProjection:
      graph: {keys: [routingOperationKey], labels: []}
  - roleId: salesOrder
    canonical: 판매 주문 결과 엔티티
    terms: [판매 주문, sales order]
    identityProjection:
      sql: {keys: [salesOrderId], labels: []}
  - roleId: salesOrderDetail
    canonical: 판매 주문 상세 결과 엔티티
    terms: [판매 주문 상세, sales order detail]
    identityProjection:
      sql: {keys: [salesOrderId, salesOrderDetailId], labels: []}
  - roleId: purchaseOrder
    canonical: 구매 주문 결과 엔티티
    terms: [구매 주문, purchase order]
    identityProjection:
      sql: {keys: [purchaseOrderId], labels: []}
  - roleId: purchaseOrderDetail
    canonical: 구매 주문 상세 결과 엔티티
    terms: [구매 주문 상세, purchase order detail]
    identityProjection:
      sql: {keys: [purchaseOrderId, purchaseOrderDetailId], labels: []}

businessConcepts:
  - conceptId: supplier.active-count
    alias: activeSupplierCount
    canonical: 활성 공급업체 수
    terms: [active supplier count]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: countDistinct
    inputs: [supplierId]
    predicates:
      - {field: active, operator: equals, value: true}
  - conceptId: product.purchased-count
    alias: purchasedProductCount
    canonical: 외부 구매 제품 수
    terms: [구매 제품 수, purchased product count]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: countDistinct
    inputs: [productId]
    predicates:
      - {field: makeFlag, operator: equals, value: false}
  - conceptId: product.count
    alias: productCount
    canonical: 선택 grain의 제품 수
    terms: [제품 개수, product count]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: countDistinct
    inputs: [productId]
  - conceptId: inventory.actual-stock
    alias: actualStock
    canonical: 제품별 현재 실제 재고
    terms: [현재 재고, 실제 재고, 재고 합계]
    kind: aggregate
    sources: [sql]
    grain: [productId]
    operation: sum
    inputs: [quantity]
  - conceptId: inventory.shortage
    alias: shortageQty
    canonical: 안전재고 부족 수량
    terms: [부족 수량, 부족분, 모자란 수량]
    kind: derived
    sources: [sql]
    grain: [productId]
    operation: clampedDifference
    inputs: [safetyStockLevel, actualStock]
  - conceptId: sales.total-order-quantity
    alias: totalOrderQty
    canonical: 판매 주문 수량 합계
    terms: [총 주문 수량]
    kind: aggregate
    sources: [sql]
    grain: [productId]
    operation: sum
    inputs: [orderQty]
  - conceptId: purchasing.total-rejected-quantity
    alias: totalRejectedQty
    canonical: 구매 반려 수량 합계
    terms: [총 반려 수량]
    kind: aggregate
    sources: [sql]
    grain: [supplierId]
    operation: sum
    inputs: [rejectedQty]
  - conceptId: product.price-cost-gap
    alias: priceCostGap
    canonical: 정가와 표준원가의 차이
    terms: [가격 원가 차이]
    kind: derived
    sources: [sql]
    grain: [productId]
    operation: difference
    inputs: [listPrice, standardCost]
  - conceptId: supplier.supplied-product-count
    alias: suppliedProductCount
    canonical: 공급업체별 서로 다른 공급 제품 수
    terms: [공급 제품 종류 수]
    kind: aggregate
    sources: [sql]
    grain: [supplierId]
    operation: countDistinct
    inputs: [productId]
  - conceptId: product.average-list-price
    alias: averageListPrice
    canonical: 선택 grain의 평균 정가
    terms: [평균 판매 가격]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: average
    inputs: [listPrice]
  - conceptId: work-order.count
    alias: workOrderCount
    canonical: 선택 grain의 서로 다른 작업지시 수
    terms: [작업지시 개수]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: countDistinct
    inputs: [workOrderId]
  - conceptId: work-order.total-scrapped-quantity
    alias: totalScrappedQty
    canonical: 선택 grain의 폐기 수량 합계
    terms: [총 폐기 수량]
    kind: aggregate
    sources: [sql]
    grain: []
    operation: sum
    inputs: [scrappedQty]
  - conceptId: graph.depth
    alias: depth
    canonical: anchor에서 destination까지의 경로 깊이
    terms: [경로 깊이, path depth]
    kind: path
    sources: [graph]
    grain: [componentId]
    operation: pathLength
    inputs: []
  - conceptId: graph.minimum-depth
    alias: minDepth
    canonical: destination별 최소 경로 깊이
    terms: [최소 깊이, minimum depth]
    kind: path
    sources: [graph]
    grain: [componentId]
    operation: minimumPathLength
    inputs: [depth]
  - conceptId: graph.minimum-depth-a
    alias: minDepthA
    canonical: 첫 번째 anchor에서 destination까지의 최소 경로 깊이
    terms: [첫 번째 최소 깊이]
    kind: path
    sources: [graph]
    grain: [componentId]
    operation: minimumPathLength
    inputs: [depth]
  - conceptId: graph.minimum-depth-b
    alias: minDepthB
    canonical: 두 번째 anchor에서 destination까지의 최소 경로 깊이
    terms: [두 번째 최소 깊이]
    kind: path
    sources: [graph]
    grain: [componentId]
    operation: minimumPathLength
    inputs: [depth]
  - conceptId: graph.path-product-ids
    alias: pathProductIds
    canonical: anchor에서 destination 순서의 제품 식별자 경로
    terms: [제품 ID 경로]
    kind: path
    sources: [graph]
    grain: []
    operation: orderedPathProjection
    inputs: [productId]
  - conceptId: graph.path-product-names
    alias: pathProductNames
    canonical: anchor에서 destination 순서의 제품 이름 경로
    terms: [제품명 경로]
    kind: path
    sources: [graph]
    grain: []
    operation: orderedPathProjection
    inputs: [productName]
  - conceptId: supplier-pair.shared-component-count
    alias: sharedComponentCount
    canonical: 공급업체 쌍이 함께 공급하는 서로 다른 부품 수
    terms: [공동 공급 부품 수]
    kind: aggregate
    sources: [graph]
    grain: [supplierIdA, supplierIdB]
    operation: countDistinct
    inputs: [componentId]

resultShapes:
  - shapeId: bom-component-usage
    canonical: 지정 부품을 사용하는 완제품별 BOM 경로
    triggerTermGroups:
      - [부품, 사용하는 완제품]
    sources:
      graph:
        displayEntities: [component, finishedProduct]
        requiredOutputs: [depth, pathProductIds, pathProductNames]
        rowGrain: [pathProductIds]
        completionGroups:
          - [depth, pathProductIds, pathProductNames]
        resultInvariant: bom_path_v1
  - shapeId: bom-path
    canonical: BOM 두 끝점 사이의 개별 경로
    triggerTermGroups:
      - [BOM, 경로]
      - [어떻게 연결, 경로]
    sources:
      graph:
        displayEntities: [finishedProduct, component]
        requiredOutputs: [depth, pathProductIds, pathProductNames]
        rowGrain: [pathProductIds]
        completionGroups:
          - [depth, pathProductIds, pathProductNames]
        resultInvariant: bom_path_v1
  - shapeId: bom-hierarchy
    canonical: BOM 계층 또는 부품 트리
    triggerTermGroups:
      - [계층, 부품]
      - [부품 트리]
    sources:
      graph:
        displayEntities: [rootProduct, component]
        requiredOutputs: [depth, pathProductIds, pathProductNames]
        rowGrain: [pathProductIds]
        completionGroups:
          - [depth, pathProductIds, pathProductNames]
        resultInvariant: bom_path_v1
  - shapeId: bom-leaf-components
    canonical: BOM 최하위 부품별 최소 깊이
    triggerTermGroups:
      - [최하위, 부품]
    sources:
      graph:
        displayEntities: [component]
        requiredOutputs: [minDepth]
        rowGrain: [componentId]
        completionGroups: []
        resultInvariant: null
  - shapeId: supplier-bom-impact
    canonical: 공급 부품에서 영향을 받는 완제품 경로
    triggerTermGroups:
      - [공급, 영향, 완제품]
      - [공급하는 부품, 사용하는 완제품]
    sources:
      graph:
        displayEntities: [component, finishedProduct]
        requiredOutputs: [depth, pathProductIds]
        rowGrain: [pathProductIds]
        completionGroups:
          - [depth, pathProductIds]
        resultInvariant: bom_path_v1
  - shapeId: work-order-scrap-routing
    canonical: 작업지시의 생산·폐기 사실과 공정·작업장
    triggerTermGroups:
      - [작업지시, 폐기, 작업장]
      - [뭐 만들, 얼마나 버, 어디서 작업]
    sources:
      sql:
        displayEntities: [workOrder, product, scrapReason]
        requiredOutputs: [scrappedQty]
        rowGrain: [workOrderId]
        completionGroups: []
        resultInvariant: null
      graph:
        displayEntities: [workOrder, routingOperation, location]
        requiredOutputs: [sequence]
        rowGrain: [routingOperationKey]
        completionGroups: []
        resultInvariant: null
  - shapeId: workplace-products
    canonical: 작업장을 거친 제품
    triggerTermGroups:
      - [작업장, 거친 제품]
    sources:
      graph:
        displayEntities: [location, product]
        requiredOutputs: []
        rowGrain: [productId]
        completionGroups: []
        resultInvariant: null
  - shapeId: product-work-order-aggregate
    canonical: 제품별 작업지시와 폐기 수량 집계
    triggerTermGroups:
      - [제품, 작업지시, 폐기 수량]
      - [제품별, 작업지시 수]
    sources:
      sql:
        displayEntities: [product]
        requiredOutputs: [workOrderCount, totalScrappedQty]
        rowGrain: [productId]
        completionGroups: []
        resultInvariant: null
  - shapeId: scrapped-work-orders-by-product
    canonical: 폐기 사유에 해당하는 제품별 작업지시 수
    triggerTermGroups:
      - [폐기, 작업지시, 제품, 작업지시 수]
    sources:
      sql:
        displayEntities: [scrapReason, product]
        requiredOutputs: [workOrderCount]
        rowGrain: [productId]
        completionGroups: []
        resultInvariant: null
  - shapeId: work-order-scrap-ranking
    canonical: 폐기 수량이 큰 작업지시와 폐기 사유
    triggerTermGroups:
      - [폐기, 작업지시, 이유]
    sources:
      sql:
        displayEntities: [workOrder, product, scrapReason]
        requiredOutputs: [scrappedQty]
        rowGrain: [workOrderId]
        completionGroups: []
        resultInvariant: null

transforms:
  - transformId: bom_shortage_v1
    outputScale: 6
    requiredOutputs:
      graph:
        - finishedProductId
        - finishedProductName
        - componentId
        - componentName
        - depth
        - pathProductIds
        - quantityPerAssembly
        - supplierId
        - supplierName
      sql: [componentId, makeFlag, actualStock]
