services:
  neo4j:
    image: neo4j:5.26.29-enterprise
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "neo4j status | grep -q running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16.14
    container_name: postgres
    ports:
      - "52001:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adventureworks}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-adventureworks}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: backend
    restart: on-failure
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
      POSTGRES_POOL_MIN_SIZE: ${POSTGRES_POOL_MIN_SIZE:-1}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-5}
      POSTGRES_WRITE_POOL_MIN_SIZE: ${POSTGRES_WRITE_POOL_MIN_SIZE:-1}
      POSTGRES_WRITE_POOL_MAX_SIZE: ${POSTGRES_WRITE_POOL_MAX_SIZE:-2}
      SQL_ROW_LIMIT: ${SQL_ROW_LIMIT:-200}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OBS_LOG_FAILED_QUERY: ${OBS_LOG_FAILED_QUERY:-true}
      OBS_LOG_FAILED_QUERY_MAX_CHARS: ${OBS_LOG_FAILED_QUERY_MAX_CHARS:-4000}
      OBS_LOG_QUESTION_PREVIEW: ${OBS_LOG_QUESTION_PREVIEW:-true}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      QUESTION_FINGERPRINT_SECRET: ${QUESTION_FINGERPRINT_SECRET:-development-only-question-fingerprint-key}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-development-only-metrics-token}
      ENTITY_SIMILARITY_THRESHOLD: ${ENTITY_SIMILARITY_THRESHOLD:-0.3}
      ENTITY_CANDIDATE_LIMIT: ${ENTITY_CANDIDATE_LIMIT:-5}
      SQL_REPAIR_ENGINE: ${SQL_REPAIR_ENGINE:-v1}
      CYPHER_REPAIR_ENGINE: ${CYPHER_REPAIR_ENGINE:-v1}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./queries:/queries:ro
      - ./schema:/schema:ro
      - ./ontology:/ontology:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "8080:5173"
    depends_on:
      - backend

volumes:
  neo4j_data:
  postgres_data:
