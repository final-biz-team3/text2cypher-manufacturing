name: Text-to-query Manual Evaluation
run-name: T2Q ${{ inputs.suite }} / ${{ inputs.ids }} / ${{ inputs.runs }}x / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite
        type: choice
        options: [canonical, robustness, complexity, all]
        default: canonical
      ids:
        description: Query IDs (all, RQ01,RQ08, RQ01-RQ11, HQ01-HQ10)
        type: string
        default: all
      routes:
        description: Query route
        type: choice
        options: [all, SQL, GRAPH, HYBRID]
        default: all
      model:
        description: OpenAI-compatible model
        type: string
        default: gpt-5.6-luna
      reasoning-effort:
        description: Route/query reasoning effort
        type: choice
        options: [medium, high]
        default: medium
      runs:
        description: Trials per case
        type: choice
        options: ["1", "3"]
        default: "1"
      validate-gold:
        description: Validate snapshot and Gold without model calls
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ inputs.model }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_READER_USER: ${{ secrets.NEO4J_READER_USER }}
      NEO4J_READER_PASSWORD: ${{ secrets.NEO4J_READER_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify approved Gold fingerprints
        run: >-
          PYTHONPATH=backend python -m pytest -q -m integration
          backend/tests/evaluation/test_gold_integration.py

      - name: Run report-only evaluation
        id: evaluation
        shell: bash
        env:
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_IDS: ${{ inputs.ids }}
          EVAL_ROUTES: ${{ inputs.routes }}
          EVAL_RUNS: ${{ inputs.runs }}
          EVAL_VALIDATE_GOLD: ${{ inputs['validate-gold'] }}
        run: |
          eval_args=(
            --suite "${EVAL_SUITE}"
            --ids "${EVAL_IDS}"
            --routes "${EVAL_ROUTES}"
            --runs "${EVAL_RUNS}"
            --model "${OPENAI_MODEL}"
            --reasoning-effort "${{ inputs['reasoning-effort'] }}"
            --output-dir artifacts/t2c-eval
          )
          if [[ "${EVAL_VALIDATE_GOLD}" == "true" ]]; then
            eval_args+=(--validate-gold)
          fi

          set +e
          PYTHONPATH=backend python -m evaluation "${eval_args[@]}"
          eval_exit_code=$?
          set -e
          echo "exit_code=${eval_exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Add report to workflow summary
        if: always() && hashFiles('artifacts/t2c-eval/report.md') != ''
        run: cat artifacts/t2c-eval/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t2c-evaluation-${{ github.run_id }}
          path: artifacts/t2c-eval
          if-no-files-found: error
          retention-days: 30

      - name: Propagate infrastructure exit code
        if: always()
        shell: bash
        run: exit "${{ steps.evaluation.outputs.exit_code || 2 }}"
