name: Code Quality

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "etl/**"
      - "schema/**"
      - "queries/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/code-quality.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "etl/**"
      - "schema/**"
      - "queries/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/code-quality.yml"

permissions:
  contents: read

jobs:
  backend-code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run code quality checks
        run: |
          ruff check backend
          black --check backend
          mypy backend

  etl-code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r etl/requirements-dev.txt

      - name: Run ETL tests
        working-directory: etl
        run: python -m pytest tests -q

      - name: Run ruff
        run: ruff check etl
