meta:
  confirmedAt: "2026-08-19"
  nodeCount: 6
  relationshipCount: 6
  bomAsOfDate: "2014-08-08"
  bomMaxDepth: 4
  sources:
    - neo4j_structured_mvp_design/structured_mvp_graph_schema.yaml
    - neo4j_structured_mvp_design/structured_mvp_source_mapping.md
    - neo4j_structured_mvp_design/structured_mvp_loading_rules.md

nodes:
  Product:
    aliases: [제품, 부품, 완제품]
    uniqueKey: productId
    constraintName: product_id
    source: {schema: production, table: product}
    outputAliases:
      productId: [productId]
      name: [productName]
      sellableFinishedGood: [sellableFinishedGood]
    properties:
      productId: {type: INTEGER, required: true, sourceColumn: productid, aliases: [제품 ID, 부품 ID, 완제품 ID]}
      name: {type: STRING, required: true, sourceColumn: name, aliases: [제품명, 부품명, 완제품명]}
      sellableFinishedGood: {type: BOOLEAN, required: true, sourceColumn: finishedgoodsflag, aliases: [판매 가능한 완제품 여부, 완제품 여부]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  Supplier:
    aliases: [공급업체, 업체, 공급사]
    uniqueKey: supplierId
    constraintName: supplier_id
    source: {schema: purchasing, table: vendor}
    outputAliases:
      supplierId: [supplierId]
      name: [supplierName]
      active: [active]
    properties:
      supplierId: {type: INTEGER, required: true, sourceColumn: businessentityid, aliases: [공급업체 ID, 업체 ID, 공급사 ID]}
      name: {type: STRING, required: true, sourceColumn: name, aliases: [공급업체명, 업체명, 공급사명]}
      active: {type: BOOLEAN, required: true, sourceColumn: activeflag, aliases: [활성 여부, 활성 상태]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  WorkOrder:
    aliases: [작업지시, 생산 작업지시]
    uniqueKey: workOrderId
    constraintName: work_order_id
    source: {schema: production, table: workorder}
    outputAliases:
      workOrderId: [workOrderId]
    properties:
      workOrderId: {type: INTEGER, required: true, sourceColumn: workorderid, aliases: [작업지시 ID]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  RoutingOperation:
    aliases: [공정, 작업 공정, 라우팅 공정]
    uniqueKey: routingOperationKey
    constraintName: routing_operation_key
    keyComposition: "workorderid + '-' + productid + '-' + operationsequence"
    source: {schema: production, table: workorderrouting}
    outputAliases:
      routingOperationKey: [routingOperationKey]
      sequence: [sequence]
    properties:
      routingOperationKey: {type: STRING, required: true, synthetic: true, aliases: [공정 식별 키]}
      sequence: {type: INTEGER, required: true, sourceColumn: operationsequence, aliases: [공정 순서, 작업 순서]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  Location:
    aliases: [작업장, 공정 위치]
    uniqueKey: locationId
    constraintName: location_id
    source: {schema: production, table: location}
    outputAliases:
      locationId: [locationId]
      name: [locationName]
    properties:
      locationId: {type: INTEGER, required: true, sourceColumn: locationid, aliases: [작업장 ID, 공정 위치 ID]}
      name: {type: STRING, required: true, sourceColumn: name, aliases: [작업장명, 공정 위치명]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  ScrapReason:
    aliases: [폐기 사유, 폐기사유]
    uniqueKey: scrapReasonId
    constraintName: scrap_reason_id
    source: {schema: production, table: scrapreason}
    outputAliases:
      scrapReasonId: [scrapReasonId]
      name: [scrapReasonName]
    properties:
      scrapReasonId: {type: INTEGER, required: true, sourceColumn: scrapreasonid, aliases: [폐기 사유 ID, 폐기사유 ID]}
      name: {type: STRING, required: true, sourceColumn: name, aliases: [폐기 사유명, 폐기사유명]}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

relationships:
  SUPPLIES:
    aliases: [부품 공급 관계, 부품을 공급함, 부품의 공급업체]
    from: Supplier
    to: Product
    source: {schema: purchasing, table: productvendor}
    loadCondition: "vendor.activeflag = true"
    properties:
      supplyKey: {type: STRING, required: true, synthetic: true}
      syncRunId: {type: STRING, required: true, technical: true}

  REQUIRES_COMPONENT:
    aliases: [BOM 구성 관계, BOM 경로, 하위 부품 관계, 부품을 사용함, 부품을 필요로 함]
    from: Product   # 상위 조립품(assembly)
    to: Product     # 하위 부품(component)
    source: {schema: production, table: billofmaterials}
    loadCondition: "load all rows; filter validity at query time via bomAsOfDate"
    outputAliases:
      bomId: [bomId]
      quantityPerAssembly: [quantityPerAssembly]
      startDate: [startDate]
      endDate: [endDate]
    properties:
      bomId: {type: INTEGER, required: true, sourceColumn: billofmaterialsid, aliases: [BOM ID]}
      quantityPerAssembly: {type: FLOAT, required: true, sourceColumn: perassemblyqty, aliases: [조립품 1개당 필요 수량, 단위당 필요 수량]}
      startDate: {type: DATE, required: true, sourceColumn: startdate, aliases: [BOM 유효 시작일]}
      endDate: {type: DATE, required: false, sourceColumn: enddate, aliases: [BOM 유효 종료일]}
      syncRunId: {type: STRING, required: true, technical: true}

  PRODUCES:
    aliases: [제품 생산 관계, 작업지시가 생산하는 제품]
    from: WorkOrder
    to: Product
    source: {schema: production, table: workorder}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  HAS_OPERATION:
    aliases: [작업 공정 관계, 작업지시가 포함하는 공정, 작업지시가 거친 공정]
    from: WorkOrder
    to: RoutingOperation
    source: {schema: production, table: workorderrouting}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  PERFORMED_AT:
    aliases: [공정 수행 작업장, 공정 수행 위치, 공정이 수행되는 작업장]
    from: RoutingOperation
    to: Location
    source: {schema: production, table: workorderrouting}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  SCRAPPED_DUE_TO:
    aliases: [폐기 사유 관계, 폐기 원인 관계, 작업지시의 폐기 사유]
    from: WorkOrder
    to: ScrapReason
    source: {schema: production, table: workorder}
    loadCondition: "scrappedqty > 0 AND scrapreasonid IS NOT NULL"
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

indexes:
  - name: product_name
    type: RANGE
    label: Product
    properties: [name]
  - name: supplier_name
    type: RANGE
    label: Supplier
    properties: [name]
