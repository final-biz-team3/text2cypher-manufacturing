# =============================================================================
# 그래프 스키마 (구조화 MVP, 2026-08-19 교체)
#
# 이 파일은 Neo4j / backend / frontend / LLM 프롬프트가 함께 참조하는
# "기준 문서"다. PostgreSQL(AdventureWorks)이 원본(system of record)이고
# Neo4j는 관계 탐색 전용 read model이다.
#
# 근거 자료: neo4j_structured_mvp_design/ 패키지(structured_mvp_graph_schema.yaml,
# structured_mvp_source_mapping.md, structured_mvp_loading_rules.md,
# structured_mvp_physical_design_validation.md), ITDA-Neo4j_v4(arrows.app 다이어그램,
# etl/data/에 로컬 보관, git 추적 제외).
#
# 참고: backend/graph_schema의 로더(models.py, extra="ignore")는
# nodes.*.properties.*.type과 relationships.*.{from,to,properties.*.type}만
# 읽고 나머지는 전부 무시한다.
#
# 제약조건은 이 yaml에서 자동 생성하지 않는다(Enterprise 전용 문법을 쓰는
# etl/graph_constraints.py는 이번 스키마엔 적용하지 않기로 결정 — 대신
# schema/structured_mvp_constraints.cypher를 그대로 실행한다. Community
# 호환 확인 완료, docs/superpowers/plans/2026-08-19-structured-mvp-data-loading.md 참고).
# =============================================================================

meta:
  confirmedAt: "2026-08-19"
  nodeCount: 6
  relationshipCount: 6
  bomAsOfDate: "2014-08-08"
  bomMaxDepth: 4
  sources:
    - neo4j_structured_mvp_design/structured_mvp_graph_schema.yaml
    - neo4j_structured_mvp_design/structured_mvp_source_mapping.md
    - neo4j_structured_mvp_design/structured_mvp_loading_rules.md

nodes:
  Product:
    uniqueKey: productId
    constraintName: product_id
    source: {schema: production, table: product}
    properties:
      productId: {type: INTEGER, required: true, sourceColumn: productid}
      name: {type: STRING, required: true, sourceColumn: name}
      sellableFinishedGood: {type: BOOLEAN, required: true, sourceColumn: finishedgoodsflag}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  Supplier:
    uniqueKey: supplierId
    constraintName: supplier_id
    source: {schema: purchasing, table: vendor}
    properties:
      supplierId: {type: INTEGER, required: true, sourceColumn: businessentityid}
      name: {type: STRING, required: true, sourceColumn: name}
      active: {type: BOOLEAN, required: true, sourceColumn: activeflag}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  WorkOrder:
    uniqueKey: workOrderId
    constraintName: work_order_id
    source: {schema: production, table: workorder}
    properties:
      workOrderId: {type: INTEGER, required: true, sourceColumn: workorderid}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  RoutingOperation:
    uniqueKey: routingOperationKey
    constraintName: routing_operation_key
    keyComposition: "workorderid + '-' + productid + '-' + operationsequence"
    source: {schema: production, table: workorderrouting}
    properties:
      routingOperationKey: {type: STRING, required: true, synthetic: true}
      sequence: {type: INTEGER, required: true, sourceColumn: operationsequence}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  Location:
    uniqueKey: locationId
    constraintName: location_id
    source: {schema: production, table: location}
    properties:
      locationId: {type: INTEGER, required: true, sourceColumn: locationid}
      name: {type: STRING, required: true, sourceColumn: name}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

  ScrapReason:
    uniqueKey: scrapReasonId
    constraintName: scrap_reason_id
    source: {schema: production, table: scrapreason}
    properties:
      scrapReasonId: {type: INTEGER, required: true, sourceColumn: scrapreasonid}
      name: {type: STRING, required: true, sourceColumn: name}
      sourceModifiedAt: {type: LOCAL_DATETIME, required: true, sourceColumn: modifieddate}
      syncRunId: {type: STRING, required: true, technical: true}

relationships:
  SUPPLIES:
    from: Supplier
    to: Product
    source: {schema: purchasing, table: productvendor}
    loadCondition: "vendor.activeflag = true"
    properties:
      supplyKey: {type: STRING, required: true, synthetic: true}
      syncRunId: {type: STRING, required: true, technical: true}

  REQUIRES_COMPONENT:
    from: Product   # 상위 조립품(assembly)
    to: Product     # 하위 부품(component)
    source: {schema: production, table: billofmaterials}
    loadCondition: "load all rows; filter validity at query time via bomAsOfDate"
    properties:
      bomId: {type: INTEGER, required: true, sourceColumn: billofmaterialsid}
      quantityPerAssembly: {type: FLOAT, required: true, sourceColumn: perassemblyqty}
      startDate: {type: DATE, required: true, sourceColumn: startdate}
      endDate: {type: DATE, required: false, sourceColumn: enddate}
      syncRunId: {type: STRING, required: true, technical: true}

  PRODUCES:
    from: WorkOrder
    to: Product
    source: {schema: production, table: workorder}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  HAS_OPERATION:
    from: WorkOrder
    to: RoutingOperation
    source: {schema: production, table: workorderrouting}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  PERFORMED_AT:
    from: RoutingOperation
    to: Location
    source: {schema: production, table: workorderrouting}
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

  SCRAPPED_DUE_TO:
    from: WorkOrder
    to: ScrapReason
    source: {schema: production, table: workorder}
    loadCondition: "scrappedqty > 0 AND scrapreasonid IS NOT NULL"
    properties:
      syncRunId: {type: STRING, required: true, technical: true}

indexes:
  - name: product_name
    type: RANGE
    label: Product
    properties: [name]
  - name: supplier_name
    type: RANGE
    label: Supplier
    properties: [name]
