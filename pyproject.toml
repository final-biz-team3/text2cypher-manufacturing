[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
mypy_path = "backend"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--verbose -m \"not integration\""
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "integration: 실제 OpenAI API/PostgreSQL 연결이 필요한 테스트",
]
