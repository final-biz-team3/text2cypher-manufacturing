auth_enabled: false
server: {http_listen_port: 3100}
common:
  path_prefix: /loki
  storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
  replication_factor: 1
  ring: {instance_addr: 127.0.0.1, kvstore: {store: inmemory}}
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
ingester:
  # 로컬 발표 환경에서 최근 3일 데모 로그를 역순으로 백필할 수 있게 한다.
  max_chunk_age: 168h
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 720h
  retention_stream:
    - selector: '{event_category="repair"}'
      priority: 1
      period: 2160h
    - selector: '{event_category="audit"}'
      priority: 2
      period: 4320h
    - selector: '{event_category="admin_review"}'
      priority: 2
      period: 4320h
compactor: {working_directory: /loki/compactor, retention_enabled: true, delete_request_store: filesystem}
