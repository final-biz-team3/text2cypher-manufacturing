repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/.*\.py$

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml", "backend"]
        pass_filenames: false
        files: ^backend/.*\.py$
        additional_dependencies:
          - bcrypt==4.2.1
          - fastapi==0.141.1
          - langgraph==1.2.11
          - neo4j==6.2.0
          - openai==2.24.0
          - psycopg==3.3.4
          - psycopg-pool==3.3.1
          - python-dotenv==1.2.2
          - pytest==9.1.1
          - pytest-asyncio==1.3.0
          - PyJWT==2.10.1
          - types-PyYAML==6.0.12.20260518
          - uvicorn==0.52.1

  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint --fix (frontend)
        entry: node frontend/node_modules/eslint/bin/eslint.js --config frontend/eslint.config.js --fix
        language: system
        files: ^frontend/.*\.(ts|tsx)$

      - id: frontend-prettier
        name: prettier --write (frontend)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|html|json|md)$
